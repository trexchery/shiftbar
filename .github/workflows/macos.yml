name: macOS application

on:
  pull_request: # not a required check, so docs-only pull requests can skip it outright
    branches: [main]
    paths-ignore: ['**.md', 'assets/**', 'docs/**']
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Python engine dependencies
        run: uv sync --locked --python python3.12
      - name: Shared backend suite
        run: dotnet test dock/Shiftbar.Backend.Tests/Shiftbar.Backend.Tests.csproj --nologo --logger "trx;LogFileName=macos-backend.trx" --results-directory TestResults
      - name: Real desktop executable and private IPC
        env:
          SHIFTBAR_TEST_BACKEND: ${{ github.workspace }}/dock/Shiftbar.Backend/bin/Debug/net8.0/shiftbar-backend
        run: uv run --python python3.12 pytest tests/test_backend_host.py -n 0
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-verification
          path: TestResults/*.trx
          if-no-files-found: ignore

  apple-silicon:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build standalone app, installer images, and executable smoke checks
        run: bash macos/build-macos.sh
      - name: Upload Apple Silicon application
        uses: actions/upload-artifact@v4
        with:
          name: shiftbar-macos-arm64
          path: |
            dist/shiftbar-macos-arm64.zip
            dist/shiftbar-macos-arm64.zip.sha256
            dist/shiftbar-macos-arm64.dmg
            dist/shiftbar-macos-arm64.dmg.sha256
          if-no-files-found: error
          retention-days: 30
