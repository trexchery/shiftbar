name: Bug report
description: Something in Shiftbar isn't working right
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste access tokens, refresh tokens, API keys, or the contents of credential files.** Redact emails if you prefer.
        Security problems go through *Security → Report a vulnerability*, not here.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: Shiftbar version and Windows or macOS version
      placeholder: Shiftbar 0.8.2, Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Contents of `%LOCALAPPDATA%\shiftbar\shiftbar.log`, if it exists (it is already redacted).
      render: text
